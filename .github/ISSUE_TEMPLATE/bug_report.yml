name: Bug report
description: Report a reproducible problem with the skill, documentation, or package.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make this skill more reliable. Please remove sensitive or private content before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant context
      description: Include the skill version or commit, agent, operating system, and any non-sensitive input that helps reproduce the issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I removed sensitive, personal, and confidential information.
          required: true
